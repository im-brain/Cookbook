<!DOCTYPE html>
<!-- This tells the browser: "this file is a modern web page". -->
<html lang="en">
  <head>
    <!-- The <head> holds settings. Nothing in here shows on the page itself. -->

    <!-- Use a character set that handles every letter and symbol (é, ½, °). -->
    <meta charset="utf-8">

    <!-- Make the page fit the phone's screen instead of looking like a shrunken desktop site. -->
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- The name shown on the browser tab and in bookmarks. -->
    <title>My Cookbook</title>
  </head>

  <body>
    <!-- The <body> is everything you see on the page. -->

    <!-- <h1> is the main heading: the biggest title on the page. -->
    <h1>My Cookbook</h1>

    <!-- <p> is a paragraph of normal text. -->
    <p>Recipes coming soon.</p>
  </body>
</html>
